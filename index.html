<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="pragma" content="no-cache" />
    <meta http-equiv="expires" content="0" />
    <title>郡国</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' ry='10' fill='%23a83a2c'/%3E%3Crect x='6' y='6' width='52' height='52' rx='6' ry='6' fill='none' stroke='%23f5d895' stroke-width='2'/%3E%3Ctext x='50%25' y='54%25' text-anchor='middle' dominant-baseline='middle' font-family='Microsoft YaHei,PingFang SC,Noto Sans CJK SC,system-ui,sans-serif' font-weight='900' font-size='40' fill='%23f5d895'%3E%E9%83%A1%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./src/styles/main.css?v=0.6.4-economy" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.162.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.162.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="app">
      <header id="top-bar"></header>
      <main id="game-shell">
        <section id="map-panel">
          <canvas id="map-canvas"></canvas>
          <div id="tile-tooltip" class="tooltip hidden"></div>
          <div id="terrain-legend" class="legend hidden"></div>
          <div id="floating-layer" aria-hidden="true"></div>
          <div id="minimap-wrap">
            <canvas id="minimap" width="160" height="160"></canvas>
          </div>
          <div id="camera-help" class="camera-help">
            左键建造／拖拽 · 右键选中／取消 · 中键平移 · 右键拖动旋转 · 滚轮缩放
          </div>
          <div id="fps-overlay" class="fps-overlay">FPS --</div>
        </section>
        <aside id="mandate-panel"></aside>
      </main>
      <footer id="build-bar"></footer>
      <section id="side-panels">
        <div id="neighbor-panel" class="panel neighbor-panel hidden"></div>
        <div id="breakdown-panel" class="panel hidden"></div>
        <div id="edict-panel" class="panel"></div>
        <div id="event-log" class="panel"></div>
        <div id="debug-panel" class="panel"></div>
      </section>
      <div id="build-help" class="build-help hidden"></div>
      <div id="event-modal" class="overlay hidden"></div>
      <div id="map-picker-modal" class="modal hidden"></div>
      <div id="milestone-toast" class="toast hidden"></div>
      <div id="evaluation-modal" class="modal hidden"></div>
      <div id="main-menu-modal" class="modal hidden"></div>
    </div>
    <script type="module" src="./src/main.js?v=0.6.4-economy"></script>
  </body>
</html>
